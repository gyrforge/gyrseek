        with:
          version: 10

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test pnpm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pnpm

  cargo-audit:
    name: Dependency advisory scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
