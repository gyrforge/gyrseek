    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pip
        uses: actions/setup-python@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test pip
