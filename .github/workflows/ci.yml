# WARNING: This workflow name is tightly coupled to post_review.yml
# If you rename it, you MUST update the `workflows: ["..."]` array in post_review.yml or the bot will silently break.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  OPENCODE_VERSION: '1.17.7'
  OPENCODE_INSTALL_SHA256: 'fc3c1b2123f49b6df545a7622e5127d21cd794b15134fc3b66e1ca49f7fb297e'

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev yamllint

      - name: Run Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile*"
          recursive: true

      - name: Run Yaml Linter
        run: yamllint .

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Run Python Syntax Check
        run: python3 -m py_compile .github/scripts/*.py

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Just Lint
        run: just lint

      - name: Just Test
        run: just test

  test-pipeline-scripts:
    name: Smoke Test Pipeline Scripts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Script
        uses: actions/checkout@v7

      - name: Test Diff Logic
        run: bash .github/scripts/test_check_diff.sh

      - name: Test Sanitize Review Logic
        run: |
          python3 .github/scripts/test_sanitize_review.py
          python3 .github/scripts/test_cap_ledger.py

  generate-diff:
    name: Generate Diff
    runs-on: ubuntu-latest
    needs: test-pipeline-scripts
    if: github.event_name == 'pull_request'
    outputs:
      has_diff: ${{ steps.check-diff.outputs.has_diff }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate PR Code Diff
        id: check-diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          HAS_DIFF=$(bash .github/scripts/check_diff.sh "$BASE_SHA" "$EVENT_NAME")
          echo "has_diff=$HAS_DIFF" >> "$GITHUB_OUTPUT"

      - name: Upload PR Diff Artifact
        if: steps.check-diff.outputs.has_diff == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-diff
          path: |
            pr_diff.txt
            pr_diff.sha256
          if-no-files-found: error

  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    needs: generate-diff
    if: github.event_name == 'pull_request' && needs.generate-diff.outputs.has_diff == 'true'
    strategy:
      max-parallel: 3
      matrix:
        reviewer:
          - name: Senior Developer
            output: senior_developer_gyrseek_review.md
            prompt_file: .github/review-prompts/senior-developer.md
          - name: QA Engineer
            output: qa_engineer_gyrseek_review.md
            prompt_file: .github/review-prompts/qa-engineer.md
          - name: Application Security Engineer
            output: appsec_engineer_gyrseek_review.md
            prompt_file: .github/review-prompts/appsec-engineer.md
          - name: Threat Modeller
            output: threat_modeller_gyrseek_review.md
            prompt_file: .github/review-prompts/threat-modeller.md
          - name: Code Owner
            output: code_owner_gyrseek_review.md
            prompt_file: .github/review-prompts/code-owner.md
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}


      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install graphify
        run: uv tool install 'graphifyy==0.8.45'

      - name: Cache OpenCode binary
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: opencode-${{ env.OPENCODE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/anomalyco/opencode/v${{ env.OPENCODE_VERSION }}/install" -o ${{ runner.temp }}/opencode-install.sh
          echo "${{ env.OPENCODE_INSTALL_SHA256 }}  ${{ runner.temp }}/opencode-install.sh" | sha256sum --check
          bash ${{ runner.temp }}/opencode-install.sh --version "${{ env.OPENCODE_VERSION }}"

      - name: Ensure OpenCode in PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Download PR Diff Artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-diff

      - name: Verify PR Diff Integrity
        run: |
          sha256sum -c pr_diff.sha256 || { echo "::error::PR diff integrity check failed"; exit 1; }

      - name: Review Code as ${{ matrix.reviewer.name }}
        env:
          REVIEW_PROMPT_FILE: ${{ matrix.reviewer.prompt_file }}
          REVIEW_OUTPUT: ${{ matrix.reviewer.output }}
          REVIEWER_NAME: ${{ matrix.reviewer.name }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/generate_review.sh

      - name: Verify Review Output
        env:
          REVIEW_OUTPUT: ${{ matrix.reviewer.output }}
          REVIEWER_NAME: ${{ matrix.reviewer.name }}
        run: |
          if [ ! -s "$REVIEW_OUTPUT" ]; then
            echo "::error::Review output for $REVIEWER_NAME is missing or empty!"
            exit 1
          fi

      - name: Upload Review Results
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.reviewer.name }}
          path: ${{ matrix.reviewer.output }}
          if-no-files-found: error

  consolidate-reviews:
    name: Consolidate Reviews
    runs-on: ubuntu-latest
    needs: code-review
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}


      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install graphify
        run: uv tool install 'graphifyy==0.8.45'

      - name: Cache OpenCode binary
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: opencode-${{ env.OPENCODE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/anomalyco/opencode/v${{ env.OPENCODE_VERSION }}/install" -o ${{ runner.temp }}/opencode-install.sh
          echo "${{ env.OPENCODE_INSTALL_SHA256 }}  ${{ runner.temp }}/opencode-install.sh" | sha256sum --check
          bash ${{ runner.temp }}/opencode-install.sh --version "${{ env.OPENCODE_VERSION }}"

      - name: Ensure OpenCode in PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Download All Reviews
        uses: actions/download-artifact@v4
        with:
          pattern: review-*
          merge-multiple: true
          path: reviews

      - name: Download PR Diff Artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-diff

      - name: Verify PR Diff Integrity
        run: |
          sha256sum -c pr_diff.sha256 || { echo "::error::PR diff integrity check failed"; exit 1; }

      - name: Consolidate Reviews with OpenCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/consolidate_reviews.sh

      - name: Upload Consolidated Review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-review
          path: consolidated_gyrseek_review.md
          if-no-files-found: error

      - name: Upload Review Ledger
        uses: actions/upload-artifact@v4
        with:
          name: review-ledger
          path: review_ledger.md
          if-no-files-found: error

  linux-docker-uv-test:
    name: (Linux) (Docker) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Just test uv
        run: just test-uv "--danger-disable-seccomp"

  linux-docker-seccomp-uv-test:
    name: (Linux) (Docker) (Seccomp) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Just test uv
        run: just test-uv

  linux-docker-apparmor-seccomp-uv-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test uv
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-uv

  linux-docker-apparmor-seccomp-pip-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (pip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pip
        uses: actions/setup-python@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test pip
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pip

  linux-docker-apparmor-seccomp-poetry-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (poetry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install latest version of poetry
        uses: abatilo/actions-poetry@v4

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test poetry
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-poetry

  linux-docker-apparmor-seccomp-npm-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of npm
        uses: actions/setup-node@v6

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test npm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-npm

  linux-docker-apparmor-seccomp-pnpm-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test pnpm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pnpm

  cargo-audit:
    name: Dependency advisory scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}
