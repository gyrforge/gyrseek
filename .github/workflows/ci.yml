name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev yamllint

      - name: Lint all Dockerfiles recursively
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile*"
          recursive: true

      - name: Run yamllint
        run: yamllint .

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Just Lint
        run: just lint

      - name: Just Test
        run: just test

      - name: Cache OpenCode binary
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: opencode-1.17.7

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        env:
          OPENCODE_INSTALL_SHA256: fc3c1b2123f49b6df545a7622e5127d21cd794b15134fc3b66e1ca49f7fb297e
        run: |
          curl -fsSL "https://raw.githubusercontent.com/anomalyco/opencode/v1.17.7/install" -o /tmp/opencode-install.sh
          echo "$OPENCODE_INSTALL_SHA256  /tmp/opencode-install.sh" | sha256sum --check
          bash /tmp/opencode-install.sh --version 1.17.7

      - name: Ensure OpenCode in PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Generate AI Code Review
        run: |
          git fetch --unshallow 2>/dev/null || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" > pr_diff.txt 2>/dev/null || \
              git diff HEAD~1...HEAD > pr_diff.txt 2>/dev/null || \
              echo "(no diff)" > pr_diff.txt
          else
            git diff HEAD~1...HEAD > pr_diff.txt 2>/dev/null || echo "(no diff)" > pr_diff.txt
          fi
          opencode run -m opencode/big-pickle "
          You are reviewing a Rust CLI project called gyrseek.
          Read AGENTS.md then review the PR diff in pr_diff.txt. Do NOT
          execute the Mandatory Pre-Session Setup or Mandatory Post-Change
          Policy -- this is a stateless CI review, not an interactive session.
          Read the file and review the changes. Check for:
            - Logic errors and race conditions
            - Unsafe code and memory safety issues
            - Rust idioms (prefer iterator adaptors over Vec+push loops, use
              filter_map/partition/map where appropriate)
            - Rust and general coding best practices (will the code run efficiently, fast, etc.)
            - Error handling (unwraps, expect, ignored Results)
            - Security vulnerabilities (command injection, path traversal, etc.)
            - API design and type safety
          Output a concise review report. Write the report to gyrseek_review.md.
          "

      - name: Post Review Comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file gyrseek_review.md \
            --repo "${{ github.repository }}"

  linux-docker-uv-test:
    name: (Linux) (Docker) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Just test uv
        env:
          GYRSEEK_DOCKER_SECCOMP_PROFILE: false
        run: just test-uv

  linux-docker-seccomp-uv-test:
    name: (Linux) (Docker) (Seccomp) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Just test uv
        run: just test-uv

  linux-docker-apparmor-seccomp-uv-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test uv
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-uv

  linux-docker-apparmor-seccomp-pip-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (pip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pip
        uses: actions/setup-python@v5

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test pip
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pip

  linux-docker-apparmor-seccomp-poetry-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (poetry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install latest version of poetry
        uses: abatilo/actions-poetry@v4

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test poetry
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-poetry

  linux-docker-apparmor-seccomp-npm-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of npm
        uses: actions/setup-node@v6

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test npm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-npm

  linux-docker-apparmor-seccomp-pnpm-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.52.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test pnpm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pnpm

  cargo-audit:
    name: Dependency advisory scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
