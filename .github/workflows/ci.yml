name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # yamllint is in Ubuntu's `universe`, which the runner image does not
      # always enable, so it comes from PyPI (the version the apt package had).
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: python -m pip install yamllint==1.37.1

      - name: Run Dockerfile Linter
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: "**/Dockerfile*"
          recursive: true

      - name: Run Yaml Linter
        run: yamllint .

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Just Lint
        run: just lint

      - name: Just Test
        run: just test

      # Real binary and real npm, no Docker: lockfiles from other sources must be refused
      # before anything is forwarded.
      - name: Just lockfile guards
        run: just test-lockfile-guards
        env:
          GYRSEEK_REQUIRE_NPM: '1'

  linux-docker-uv-test:
    name: (Linux) (Docker) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Just test uv
        run: just test-uv "--danger-disable-seccomp"

      # A real container and a payload that tries to rewrite its own and an earlier probe's trace.
      - name: Just test trace integrity
        run: just test-trace-integrity

  linux-docker-seccomp-uv-test:
    name: (Linux) (Docker) (Seccomp) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Just test uv
        run: just test-uv

  linux-docker-apparmor-seccomp-uv-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test uv
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-uv

      # Real package manager and sandbox with a local stand-in mirror: redirects are refused until the
      # host is trusted, and a drifted lockfile is not re-resolved.
      - name: Just test uv redirects and lockfile guards
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-redirects-uv

  linux-docker-apparmor-seccomp-pip-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (pip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pip
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test pip
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pip

      # Real package manager and sandbox with a local stand-in mirror: redirects are refused until the
      # host is trusted, and a drifted lockfile is not re-resolved.
      - name: Just test pip redirects and lockfile guards
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-redirects-pip

      # Real packages that vendor shared libraries named after a hash or a version: they must scan clear.
      - name: Just test native-heavy pip packages
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-native-pip

      # Heavy real packages with the import-time scan on: deep dependency trees and native extensions
      # must load and clear, and a module that needs an optional extra only warns.
      - name: Just test import-time scan of heavy pip packages
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-import-pip

  linux-docker-apparmor-seccomp-poetry-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (poetry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install latest version of poetry
        uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Build python pre-built docker scanner image
        run: just docker-build-python

      - name: Just test poetry
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-poetry

      # Real package manager and sandbox with a local stand-in mirror: redirects are refused until the
      # host is trusted, and a drifted lockfile is not re-resolved.
      - name: Just test poetry redirects and lockfile guards
        env:
          GYRSEEK_PY_SCANNER_PREBUILT: true
          GYRSEEK_PY_SCANNER_IMAGE: "gyrseek-python-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-redirects-poetry

  linux-docker-apparmor-seccomp-npm-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test npm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-npm

      # Real package manager and sandbox with a local stand-in mirror: redirects are refused until the
      # host is trusted, and a drifted lockfile is not re-resolved.
      - name: Just test npm redirects and lockfile guards
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-redirects-npm

      # Real packages that vendor shared libraries named after a hash or a version: they must scan clear.
      - name: Just test native-heavy npm packages
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-native-npm

      # Heavy real packages with the import-time scan on: native addons, subpath-only dependencies and a
      # big tree must load and clear, and a package that cannot load in any version only warns.
      - name: Just test import-time scan of heavy npm packages
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-import-npm

  linux-docker-apparmor-seccomp-pnpm-test:
    name: (Linux) (Docker) (AppArmor) (Seccomp) Test CLI with (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev apparmor-utils

      - name: Install latest version of pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Build npm pre-built docker scanner image
        run: just docker-build-npm

      - name: Just test pnpm
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-pnpm

      # Real package manager and sandbox with a local stand-in mirror: redirects are refused until the
      # host is trusted, and a drifted lockfile is not re-resolved.
      - name: Just test pnpm redirects and lockfile guards
        env:
          GYRSEEK_NPM_SCANNER_PREBUILT: true
          GYRSEEK_NPM_SCANNER_IMAGE: "gyrseek-npm-scanner:latest"
          GYRSEEK_DOCKER_APPARMOR_PROFILE: true
        run: just test-redirects-pnpm

  cargo-audit:
    name: Dependency advisory scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The advisory database fetch is the usual flake, so a failed audit is retried twice
      # (three attempts in all). A step cannot loop over an action, hence the copies.
      - name: Audit dependencies
        id: audit1
        continue-on-error: true
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

      - name: Audit dependencies (retry 1)
        id: audit2
        if: steps.audit1.outcome == 'failure'
        continue-on-error: true
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

      - name: Audit dependencies (retry 2)
        if: steps.audit1.outcome == 'failure' && steps.audit2.outcome == 'failure'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
