name: Post Review Comment

on:
  workflow_run:
    # WARNING: This is tightly coupled to the `name:` field in ci.yml.
    # If ci.yml is renamed, this string MUST be updated to match perfectly.
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  post-comment:
    name: Sanitize and Post
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: consolidated-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmark

      - name: Sanitize and Post Consolidated Comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -f "consolidated_gyrseek_review.md" ]; then
            echo "Review artifact missing. Exiting."
            exit 0
          fi

          # Securely fetch the PR number using the workflow_run head SHA
          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/"$REPO_NAME"/commits/"$HEAD_SHA"/pulls \
            --jq '.[0].number' || echo "")

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Could not determine PR number for commit $HEAD_SHA. Exiting."
            exit 0
          fi

          source_file="consolidated_gyrseek_review.md"
          truncated_file=""
          sanitized_file=""

          cleanup() {
            rm -f "${truncated_file:-}" "${sanitized_file:-}"
          }
          trap cleanup EXIT

          if [ ! -s "$source_file" ]; then
            echo "Review output is empty; skipping comment."
            exit 0
          fi

          # Truncate if over GitHub's 65536-char comment limit.
          max_bytes=60000
          actual_bytes=$(wc -c < "$source_file")
          if [ "$actual_bytes" -gt "$max_bytes" ]; then
            python3 -c "import os;m=60000;s='consolidated_gyrseek_review.md';a=os.path.getsize(s);t=open(s,'rb').read(m).decode('utf-8',errors='ignore');open(s+'.truncated','w').write(t+chr(10)*2+'*(Review truncated at {} bytes; full output is {} bytes.)*'.format(m,a))"
            source_file="${source_file}.truncated"
            truncated_file="$source_file"
          fi

          # Sanitize: securely strip dangerous links and raw HTML using cmark
          sanitized="${source_file}.sanitized"
          sanitized_file="$sanitized"
          cmark --to commonmark "$source_file" > "$sanitized"
          gh pr comment "$PR_NUMBER" \
            --body-file "$sanitized" \
            --repo "$REPO_NAME"
