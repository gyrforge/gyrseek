name: Release

# Builds gyrseek for Linux and macOS (Apple Silicon), publishes the archives with a SHA256SUMS file, and
# attests their provenance, so that gyrseek-action (and anyone else) can
# download a pinned version and check it against a hash.
#
# - A tag `vX.Y.Z` that matches Cargo.toml, is on main, and whose commit passed
#   CI is released. A release is never replaced: to change one, bump the version.
# - A pull request that edits this file builds and smoke-tests the archives and
#   publishes nothing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions: {}

# A pull request's older run is cancelled; a release in flight never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The compiler CI tests with (`RUST_VERSION` in ci.yml). The build job fails if
  # the two differ, so a release is never built with another compiler than the
  # one that passed the tests.
  RUST_VERSION: "1.100.0"

jobs:
  verify:
    name: Check the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # check out the tag and look up an existing release
      actions: read  # read whether CI passed on the commit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, the branch, CI and the release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the version $version in Cargo.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          passed=$(gh run list --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not passed on $SHA"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; releases are not replaced, bump the version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    # Runs for a tag only after the checks passed, and for a pull request, where
    # they are skipped. A cancelled or timed-out check is neither, so it stops here.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read  # check out the source; nothing else is needed to build
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest runner image supported, so that the binary runs
          # on it and on everything newer (it links glibc and OpenSSL 3).
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # macOS has no libc or OpenSSL to match: the binary links only the
          # system frameworks, so what sets the oldest macOS it runs on is
          # MACOSX_DEPLOYMENT_TARGET (set in the Build step), not the runner.
          - runner: macos-latest
            target: aarch64-apple-darwin
          # Cross-built on the Apple Silicon runner; the Intel runner images are
          # on their way out, and nothing here needs a native one.
          - runner: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the compiler matches CI
        run: |
          set -euo pipefail
          ci=$(sed -n 's/^  RUST_VERSION: "\(.*\)"$/\1/p' .github/workflows/ci.yml)
          if [ "$ci" != "$RUST_VERSION" ]; then
            echo "::error::release.yml builds with Rust $RUST_VERSION but ci.yml tests with $ci"
            exit 1
          fi

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"  # ignored on Linux; Docker Desktop needs macOS 13 or newer anyway
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="gyrseek-v${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/gyrseek" LICENSE NOTICE README.md "dist/$name/"
          strip "dist/$name/gyrseek"
          # strip invalidates the signature that the linker gave the binary,
          # and an unsigned arm64 binary is killed when it starts.
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --force --sign - "dist/$name/gyrseek"
          fi
          # The same input gives the same archive on both systems (BSD tar has
          # no GNU options): sorted names, no owner, no timestamps, and no name
          # or date in the gzip header.
          NAME="$name" python3 - <<'PY'
          import gzip, os, tarfile

          name = os.environ["NAME"]
          top = os.path.join("dist", name)


          def plain(info, mode):
              info.uid = info.gid = 0
              info.uname = info.gname = ""
              info.mtime = 0
              info.mode = mode
              return info


          with open(f"dist/{name}.tar.gz", "wb") as raw:
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as gz:
                  with tarfile.open(fileobj=gz, mode="w", format=tarfile.GNU_FORMAT) as tar:
                      tar.addfile(plain(tarfile.TarInfo(name + "/"), 0o755))
                      for entry in sorted(os.listdir(top)):
                          path = os.path.join(top, entry)
                          info = tar.gettarinfo(path, arcname=f"{name}/{entry}")
                          mode = 0o755 if os.access(path, os.X_OK) else 0o644
                          with open(path, "rb") as f:
                              tar.addfile(plain(info, mode), f)
          PY
          rm -r "dist/${name:?}"

      - name: Run the packaged binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="gyrseek-v${version}-${TARGET}"
          mkdir smoke
          tar -xzf "dist/$name.tar.gz" -C smoke
          bin="smoke/$name/gyrseek"
          run=("$bin")
          if [ "$RUNNER_OS" = macOS ]; then
            want=${TARGET%%-*}
            [ "$want" = aarch64 ] && want=arm64
            got=$(lipo -archs "$bin")
            if [ "$got" != "$want" ]; then
              echo "::error::the binary is built for '$got', expected '$want'"
              exit 1
            fi
            # An Intel binary runs on the Apple Silicon runner only through
            # Rosetta, which the image may not have: the architecture check
            # above still holds, the run is skipped with a warning.
            if [ "$want" != "$(uname -m)" ]; then
              if arch "-$want" /usr/bin/true 2>/dev/null; then
                run=(arch "-$want" "$bin")
              else
                run=()
                echo "::warning::cannot run a $want binary on this runner (no Rosetta); built and checked, not run"
              fi
            fi
          fi
          if [ "${#run[@]}" -gt 0 ]; then
            out=$("${run[@]}" --version)
            if [ "$out" != "gyrseek $version" ]; then
              echo "::error::the packaged binary reports '$out', expected 'gyrseek $version'"
              exit 1
            fi
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L "$bin"
            codesign --verify --strict "$bin"
          else
            ldd "$bin"
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish
    needs: [verify, build]
    # Both must have succeeded, not merely "not failed": the checks in verify
    # are what makes publishing safe.
    if: ${{ github.event_name == 'push' && needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create this environment in Settings > Environments, require a reviewer and
    # limit deployments to the tags `v*`: publishing then waits for a second person.
    environment: release
    permissions:
      contents: write  # create the release and upload its files
      id-token: write  # sign the provenance with the workflow's identity
      attestations: write  # store the provenance with the repository
    # No checkout: this job holds write permissions, so it runs no code from
    # the repository, only the pinned actions below and the gh CLI.
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum gyrseek-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false

      - name: Create the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A draft left by a failed run is invisible to the check in the
          # verify job. Stop on it, so that two drafts never compete for the tag:
          # delete it on the Releases page and re-run.
          drafts=$(gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.isDraft and .tagName == \"$TAG\") | .tagName")
          if [ -n "$drafts" ]; then
            echo "::error::a draft release for $TAG exists; delete it and re-run"
            exit 1
          fi
          # Created as a draft and published last, once every file is attached,
          # so that a failure while uploading never leaves a public release
          # that lacks files.
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes \
            dist/gyrseek-*.tar.gz dist/SHA256SUMS
          gh release edit "$TAG" --draft=false
