[package]
name = "gyrseek"
version = "0.3.1"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
semver = "1.0"
pep440_rs = "0.7"
tempfile = "3"
dns-lookup = "2"
chrono = { version = "0.4", features = ["clock"] }
